x-app-environment: &app-environment
  DATABASE_URL: postgresql://sankari:${POSTGRES_PASSWORD}@postgres:5432/sankari
  NEXTAUTH_URL: ${NEXTAUTH_URL}
  NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
  GOOGLE_WORKSPACE_DOMAIN: ${GOOGLE_WORKSPACE_DOMAIN:-sankari-holding.com}
  ADMIN_EMAILS: ${ADMIN_EMAILS}
  BOARD_EMAILS: ${BOARD_EMAILS:-}
  AGENT_EMAILS: ${AGENT_EMAILS:-}
  DEV_EMAILS: ${DEV_EMAILS:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  SMTP_FROM: "${SMTP_FROM:-Sankari Platform <it@sankari-holding.com>}"
  ALERT_EMAIL: ${ALERT_EMAIL:-}
  JIRA_BASE_URL: ${JIRA_BASE_URL:-}
  JIRA_SERVICE_EMAIL: ${JIRA_SERVICE_EMAIL:-}
  JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
  JIRA_PROJECT_KEYS: ${JIRA_PROJECT_KEYS:-}
  JIRA_ALLOWED_EMAILS: ${JIRA_ALLOWED_EMAILS:-}
  JIRA_POLL_MINUTES: ${JIRA_POLL_MINUTES:-10}
  RATE_LIMIT_POINTS: ${RATE_LIMIT_POINTS:-60}
  RATE_LIMIT_DURATION: ${RATE_LIMIT_DURATION:-60}
  AUTH_DEV_BYPASS: "false"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sankari
      POSTGRES_USER: sankari
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sankari -d sankari"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
    expose: ["3000"]

  worker:
    build: .
    restart: unless-stopped
    command: ["node_modules/.bin/tsx", "scripts/worker.ts"]
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy

  backup:
    build: .
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command: ["while true; do /app/scripts/backup.sh; sleep 86400; done"]
    environment:
      DATABASE_URL: postgresql://sankari:${POSTGRES_PASSWORD}@postgres:5432/sankari
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      RCLONE_REMOTE: ${RCLONE_REMOTE:-}
      RCLONE_CONFIG_REMOTE_TYPE: ${RCLONE_CONFIG_REMOTE_TYPE:-}
      RCLONE_CONFIG_REMOTE_PROVIDER: ${RCLONE_CONFIG_REMOTE_PROVIDER:-}
      RCLONE_CONFIG_REMOTE_ACCESS_KEY_ID: ${RCLONE_CONFIG_REMOTE_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_REMOTE_SECRET_ACCESS_KEY: ${RCLONE_CONFIG_REMOTE_SECRET_ACCESS_KEY:-}
      RCLONE_CONFIG_REMOTE_ENDPOINT: ${RCLONE_CONFIG_REMOTE_ENDPOINT:-}
    volumes:
      - backup_data:/backups
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  backup_data:
