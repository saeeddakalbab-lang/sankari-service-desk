services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATA_DIR: /app/data
      COOKIE_SECURE: 'true'
    volumes:
      - sankari-data:/app/data
      - sankari-backups:/app/backups
    networks: [internal]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ['80:80', '443:443']
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [internal]
    depends_on:
      app:
        condition: service_healthy
volumes:
  sankari-data:
  sankari-backups:
  caddy-data:
  caddy-config:
networks:
  internal:
